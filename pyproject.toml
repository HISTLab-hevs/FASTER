[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FASTER"
version = "1.0.0"
description = "FASTER federated learning platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "contourpy==1.3.0",
    "cycler==0.12.1",
    "deap==1.4.1",
    "filelock==3.16.1",
    "fire==0.7.0",
    "fonttools==4.54.1",
    "fsspec==2024.9.0",
    "GPUtil==1.4.0",
    "imageio==2.35.1",
    "Jinja2==3.1.4",
    "joblib==1.4.2",
    "kiwisolver==1.4.7",
    "lazy_loader==0.4",
    "MarkupSafe==3.0.1",
    "matplotlib==3.9.2",
    "medmnist==3.0.2",
    "mpmath==1.3.0",
    "networkx==3.3",
    "numpy==2.1.2",
    "packaging==24.1",
    "pandas==2.2.3",
    "pillow==10.4.0",
    "pyparsing==3.1.4",
    "python-dateutil==2.9.0.post0",
    "pytz==2024.2",
    "PyYAML==6.0.2",
    "scikit-image==0.24.0",
    "scikit-learn==1.5.2",
    "scipy==1.14.1",
    "six==1.16.0",
    "sympy==1.13.3",
    "termcolor==2.5.0",
    "threadpoolctl==3.5.0",
    "tifffile==2024.9.20",
    "torch==2.4.1",
    "torchvision==0.19.1",
    "tqdm==4.66.5",
    "typing_extensions==4.12.2",
    "tzdata==2024.2",
    "torchmetrics==1.8.2",
    "pyjwt==2.11.0",
    "cryptography==46.0.5",
    "fastapi==0.135.1",
    "uvicorn[standard]==0.41.0",
    "pymysql==1.1.2",
    "dbutils==3.1.2",
    "python-multipart==0.0.20",
    "requests==2.32.4",
    "psutil==7.2.2",
    "bcrypt==4.3.0",
    "mysql-connector-python==9.2.0",
]

[dependency-groups]
test = [
    "httpx==0.28.1",
    "pytest==8.4.2",
]
docs = [
    "Sphinx==8.2.3",
    "sphinx-rtd-theme==3.0.2",
    "sphinx-autodoc-typehints==3.2.0",
]
# Installed by default with `uv sync`; excluded in production via `uv sync --no-dev`.
dev = [
    { include-group = "test" },
    { include-group = "docs" },
]

[tool.setuptools.packages.find]
include = ["auth*", "database*", "web_backend*"]
exclude = ["job_manager*", "tests*", "docs*", "wrapper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Tests import the shared fixtures as ``tests.helpers``, so the repository root
# must stay on ``sys.path`` even when pytest is invoked from a subdirectory.
pythonpath = ["."]
